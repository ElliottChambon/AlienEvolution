name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Software/numerical verification infrastructure, not biological validation.
# Build experiment executables as normal targets, but execute only fast CTest tests.
jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Run fast tests
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure Release
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Release
        run: cmake --build build --parallel
      - name: Run fast tests
        run: ctest --test-dir build --output-on-failure
